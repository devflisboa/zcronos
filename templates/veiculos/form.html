<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if veiculo %}Editar Veículo{% else %}Novo Veículo{% endif %} | ΛUTOVIU</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/automotive.css') }}">
<meta name="csrf-token" content="{{ csrf_token() }}">
<style>
.form-wrap { max-width:620px; margin:2rem auto; padding:0 1.5rem; }
.form-title { font-size:1.3rem; font-weight:700; color:var(--accent); margin-bottom:1.5rem; }
.form-card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:1.75rem; }
.form-row { margin-bottom:1.1rem; }
.form-row label { display:block; font-size:.82rem; color:var(--muted); margin-bottom:.35rem; font-weight:500; }
.form-row input, .form-row select {
  width:100%; box-sizing:border-box;
  background:var(--bg); border:1px solid var(--border);
  color:var(--text); padding:.55rem .8rem;
  border-radius:6px; font-size:.92rem;
}
.form-row input:focus { outline:none; border-color:var(--accent); }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
.form-actions { display:flex; gap:.75rem; justify-content:flex-end; margin-top:1.75rem; }
.btn-submit { background:var(--accent); color:#000; border:none; padding:.6rem 1.4rem; border-radius:8px; font-weight:700; cursor:pointer; font-size:.92rem; }
.btn-cancel { background:var(--bg); border:1px solid var(--border); color:var(--text); padding:.6rem 1.4rem; border-radius:8px; cursor:pointer; font-size:.92rem; text-decoration:none; display:inline-flex; align-items:center; }
.flash { padding:.7rem 1rem; border-radius:8px; font-size:.88rem; margin-bottom:1rem; }
.flash-danger  { background:#3a1a1a; border:1px solid #5a2d2d; color:#ff8080; }
@media(max-width:600px){
  .form-wrap { padding:0 1rem; }
  .form-grid { grid-template-columns:1fr; }
  .form-actions { flex-direction:column-reverse; }
  .btn-submit, .btn-cancel { width:100%; justify-content:center; text-align:center; }
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sb-head">
      <div class="sb-logo">
        <div class="sb-logo-icon">Λ</div>
        <div class="sb-logo-text">
          <div class="sb-logo-brand">ΛUTOVIU</div>
          <div class="sb-logo-model">Gestão Automotiva</div>
        </div>
      </div>
    </div>
    <nav class="sb-nav">
      <div class="nav-group-label">Principal</div>
      <a href="{{ url_for('main.index') }}" class="nav-item" style="text-decoration:none;display:flex;align-items:center;gap:.5rem;color:inherit">
        <span class="ni">⊞</span> Dashboard
      </a>
      <div class="nav-group-label">Veículo</div>
      <a href="{{ url_for('veiculo.index') }}" class="nav-item active" style="text-decoration:none;display:flex;align-items:center;gap:.5rem;color:inherit">
        <span class="ni">🚘</span> Meus Veículos
      </a>
      <div class="nav-group-label" style="margin-top:auto">Conta</div>
      <a href="{{ url_for('auth.logout') }}" class="nav-item" style="text-decoration:none;display:flex;align-items:center;gap:.5rem;color:inherit">
        <span class="ni">⏻</span> Sair
      </a>
    </nav>
  </aside>

  <main id="main">
    <div class="form-wrap">
      <div class="form-title">{{ '✏️ Editar Veículo' if veiculo else '🚘 Novo Veículo' }}</div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
        <div class="flash flash-{{ cat }}">{{ msg }}</div>
        {% endfor %}
      {% endwith %}

      <div class="form-card">
        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="form-grid">
            <div class="form-row">
              <label>Marca *</label>
              <input name="marca" value="{{ veiculo.marca if veiculo else '' }}"
                     placeholder="Fiat, VW, Toyota..." required>
            </div>
            <div class="form-row">
              <label>Modelo *</label>
              <input name="modelo" value="{{ veiculo.modelo if veiculo else '' }}"
                     placeholder="Cronos, Gol, Corolla..." required>
            </div>
          </div>

          <div class="form-row">
            <label>Versão</label>
            <input name="versao" value="{{ veiculo.versao if veiculo else '' }}"
                   placeholder="Drive 1.3 Manual">
          </div>

          <div class="form-row">
            <label>Motor</label>
            <input name="motor" value="{{ veiculo.motor if veiculo else '' }}"
                   placeholder="Firefly 1.3 Flex 109 CV">
          </div>

          <div class="form-grid">
            <div class="form-row">
              <label>Ano *</label>
              <input name="ano" type="number" min="1950" max="2030"
                     value="{{ veiculo.ano if veiculo else '' }}" required>
            </div>
            <div class="form-row">
              <label>Placa</label>
              <input name="placa" value="{{ veiculo.placa if veiculo else '' }}"
                     placeholder="ABC1D23" maxlength="8" style="text-transform:uppercase">
            </div>
          </div>

          <div class="form-grid">
            <div class="form-row">
              <label>Cor</label>
              <input name="cor" value="{{ veiculo.cor if veiculo else '' }}"
                     placeholder="Branco Banchisa, Prata...">
            </div>
            <div class="form-row">
              <label>Km atual</label>
              <input name="km_atual" type="number" min="0"
                     value="{{ veiculo.km_atual if veiculo else 0 }}">
            </div>
          </div>

          <div class="form-grid">
            <div class="form-row">
              <label>Data de compra</label>
              <input name="data_compra" type="date"
                     value="{{ veiculo.data_compra.strftime('%Y-%m-%d') if veiculo and veiculo.data_compra else '' }}">
            </div>
            <div class="form-row">
              <label>Valor de compra (R$)</label>
              <input name="valor_compra" type="number" step="0.01"
                     value="{{ veiculo.valor_compra if veiculo and veiculo.valor_compra else '' }}"
                     placeholder="0,00">
            </div>
          </div>

          <div class="form-row">
            <label>Valor atual estimado (R$)</label>
            <input name="valor_atual" type="number" step="0.01"
                   value="{{ veiculo.valor_atual if veiculo and veiculo.valor_atual else '' }}"
                   placeholder="0,00">
          </div>

          <div class="form-actions">
            <a href="{{ url_for('veiculo.index') }}" class="btn-cancel">Cancelar</a>
            <button type="submit" class="btn-submit">
              {{ 'Salvar alterações' if veiculo else 'Cadastrar veículo' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
<script>document.getElementById('app').classList.add('ready');</script>
</body>
</html>

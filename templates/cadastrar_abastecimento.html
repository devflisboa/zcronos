<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Abastecimento | Cronos FIAT</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='image/favicon.ico') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #000;">
        <a class="navbar-brand" href="https://cronos.fiat.com.br/versoes/drive-1.3">
            <img src="https://cronos.fiat.com.br/images/brand/logoHeaderDesktop.webp" alt="Logo da Marca" height="30">
        </a>
    </nav>

    <div class="container mt-4">
        <h3>Adicionar Abastecimento</h3>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="alert-container">
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form action="{{ url_for('abastecimento.add_abastecimento') }}" method="POST">
            <div class="form-group">
                <label for="quilometragem">Data Abastecimento</label>
                <input type="date" class="form-control" id="data" name="data" required>
            </div>
            <div class="form-group">
                <label for="quilometragem">Quilometragem</label>
                <input type="number" class="form-control" id="quilometragem" name="quilometragem" required>
            </div>
            <div class="form-group">
                <label for="litros_abastecidos">Litros Abastecidos</label>
                <input type="number" step="0.01" class="form-control" id="litros_abastecidos" name="litros_abastecidos" required>
            </div>
            <div class="form-group">
                <label for="litros_abastecidos">Preço Combustível</label>
                <input type="number" step="0.01" class="form-control" id="preco_combustivel" name="preco_combustivel" required>
            </div>
            <div class="form-group">
                <label for="valor_total">Valor Total</label>
                <input type="number" step="0.01" class="form-control" id="valor_total" name="valor_total" required>
            </div>
            <div class="form-group">
                <label for="posto">Posto</label>
                <input type="text" class="form-control" id="posto" name="posto">
            </div>
            <button type="submit" class="btn btn-dark">Salvar</button>
            <a href="{{ url_for('main.index') }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
    (function(){var t=document.querySelector('meta[name="csrf-token"]');if(!t)return;document.querySelectorAll('form').forEach(function(f){if(f.method.toLowerCase()!=='post')return;var i=document.createElement('input');i.type='hidden';i.name='csrf_token';i.value=t.content;f.appendChild(i);});})();
    </script>
</body>

</html>

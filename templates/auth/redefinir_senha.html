{% extends 'auth/login.html' %}{% block titulo %}Nova senha{% endblock %}{% block auth_content %}
<h2>Defina uma nova senha</h2>{% for cat,msg in get_flashed_messages(with_categories=true) %}<div class="alert alert-{{ cat }}" role="alert">{{ msg }}</div>{% endfor %}
<form method="post" action="{{ url_for('auth.redefinir_senha', token=token) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-group"><label for="senha">Nova senha</label><input type="password" id="senha" name="senha" minlength="12" maxlength="72" autocomplete="new-password" required></div><div class="form-group"><label for="confirmar_senha">Confirme a senha</label><input type="password" id="confirmar_senha" name="confirmar_senha" autocomplete="new-password" required></div><button type="submit" class="btn-login">Redefinir senha</button></form>{% endblock %}

{% extends 'auth/login.html' %}{% block titulo %}Recuperar senha{% endblock %}{% block auth_content %}
<h2>Recupere o acesso à sua conta</h2>{% for cat,msg in get_flashed_messages(with_categories=true) %}<div class="alert alert-{{ cat }}" role="alert">{{ msg }}</div>{% endfor %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-group"><label for="email">E-mail</label><input type="email" id="email" name="email" maxlength="120" autocomplete="email" required></div><button type="submit" class="btn-login">Enviar link de recuperação</button></form><p class="auth-links"><a href="{{ url_for('auth.login') }}">Voltar ao login</a></p>{% endblock %}

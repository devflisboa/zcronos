{% extends 'auth/login.html' %}
{% block titulo %}Confirmar e-mail{% endblock %}
{% block auth_content %}
<h2>Reenviar confirmação</h2>
{% with messages = get_flashed_messages(with_categories=true) %}{% for cat, msg in messages %}<div class="alert alert-{{ cat }}" role="alert">{{ msg }}</div>{% endfor %}{% endwith %}
<form method="POST" action="{{ url_for('auth.reenviar_confirmacao') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-group"><label for="email">E-mail</label><input type="email" id="email" name="email" autocomplete="email" maxlength="120" required></div>
<button type="submit" class="btn-login">Enviar novo link</button>
</form>
<p class="auth-links"><a href="{{ url_for('auth.login') }}">Voltar ao login</a></p>
{% endblock %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>zCronos | Entrar</title>
<link rel="icon" href="{{ url_for('static', filename='image/favicon.ico') }}" type="image/x-icon">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #0d0d0f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #e2e8f0;
  }

  .login-wrap {
    width: 100%;
    max-width: 400px;
    padding: 2rem;
  }

  .login-logo {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  .login-logo-icon {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    font-weight: 800;
    color: #fff;
    margin-bottom: 1rem;
    box-shadow: 0 4px 24px rgba(59,130,246,.35);
  }

  .login-logo-brand {
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: #64748b;
  }

  .login-logo-model {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: .05em;
    color: #f1f5f9;
  }

  .login-card {
    background: #16181d;
    border: 1px solid #1e2229;
    border-radius: 16px;
    padding: 2rem;
    box-shadow: 0 8px 48px rgba(0,0,0,.6);
  }

  .login-card h2 {
    font-size: 1.1rem;
    font-weight: 600;
    color: #94a3b8;
    margin-bottom: 1.5rem;
    text-align: center;
  }

  .alert {
    padding: .75rem 1rem;
    border-radius: 8px;
    font-size: .875rem;
    margin-bottom: 1rem;
  }
  .alert-danger { background: rgba(220,38,38,.15); border: 1px solid rgba(220,38,38,.3); color: #fca5a5; }
  .alert-info   { background: rgba(59,130,246,.12); border: 1px solid rgba(59,130,246,.25); color: #93c5fd; }

  .form-group {
    margin-bottom: 1.25rem;
  }

  .form-group label {
    display: block;
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: #64748b;
    margin-bottom: .5rem;
  }

  .form-group input {
    width: 100%;
    padding: .75rem 1rem;
    background: #0d0d0f;
    border: 1px solid #1e2229;
    border-radius: 8px;
    color: #e2e8f0;
    font-size: .9375rem;
    transition: border-color .15s;
    outline: none;
  }

  .form-group input:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59,130,246,.15);
  }

  .form-group input::placeholder { color: #334155; }

  .form-check {
    display: flex;
    align-items: center;
    gap: .5rem;
    margin-bottom: 1.5rem;
  }

  .form-check input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: #3b82f6;
    cursor: pointer;
  }

  .form-check label {
    font-size: .875rem;
    color: #64748b;
    cursor: pointer;
  }

  .btn-login {
    width: 100%;
    padding: .875rem;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: .025em;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
  }

  .btn-login:hover { opacity: .9; }
  .btn-login:active { transform: scale(.98); }

  .login-footer {
    text-align: center;
    margin-top: 1.5rem;
    font-size: .8rem;
    color: #334155;
  }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-logo">
    <div class="login-logo-icon">z</div>
    <div class="login-logo-brand">Gestão Automotiva</div>
    <div class="login-logo-model">zCronos</div>
  </div>

  <div class="login-card">
    <h2>Acesso à plataforma</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com"
               value="{{ request.form.get('email', '') }}" required autofocus>
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="••••••••" required>
      </div>

      <div class="form-check">
        <input type="checkbox" id="lembrar" name="lembrar">
        <label for="lembrar">Manter conectado por 30 dias</label>
      </div>

      <button type="submit" class="btn-login">Entrar</button>
    </form>
  </div>

  <div class="login-footer">zCronos &copy; {{ now.year }}</div>
</div>

</body>
</html>

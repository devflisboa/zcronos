<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nova Despesa | ΛUTOVIU</title>
<link rel="icon" href="{{ url_for('static', filename='image/favicon.ico') }}" type="image/x-icon">
<link rel="stylesheet" href="{{ url_for('static', filename='css/automotive.css') }}">
<meta name="csrf-token" content="{{ csrf_token() }}">
<style>
.page-wrap { padding:24px; }
.page-header { margin-bottom:24px; }
.page-title { font-size:20px; font-weight:700; color:var(--gold); }
.form-card { max-width:560px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:24px; }
.form-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.form-actions { display:flex; gap:12px; justify-content:flex-end; margin-top:24px; padding-top:20px; border-top:1px solid var(--border); }
.flash-wrap { margin-bottom:20px; max-width:560px; }
.flash { padding:12px 16px; border-radius:var(--radius-s); font-size:14px; margin-bottom:8px; }
.flash-success { background:#1a3a1a; border:1px solid #2d5a2d; color:#90ee90; }
.flash-danger  { background:#3a1a1a; border:1px solid #5a2d2d; color:#ff8080; }

.page-topbar { display:none; height:56px; background:var(--bg2); border-bottom:1px solid var(--border); align-items:center; padding:0 16px; gap:12px; position:sticky; top:0; z-index:50; }
.page-topbar-title { font-size:16px; font-weight:600; flex:1; }

@media(max-width:768px){
  .page-topbar { display:flex; }
  .page-wrap { padding:16px; }
  .form-card { padding:16px; }
}
@media(max-width:480px){
  .page-wrap { padding:12px; }
  .form-grid-2 { grid-template-columns:1fr; }
  .form-actions { flex-direction:column-reverse; }
  .form-actions .btn { width:100%; justify-content:center; }
}
</style>
</head>
<body>
<div id="app">
  <div id="sb-overlay"></div>
  <aside id="sidebar">
    <div class="sb-head">
      <div class="sb-logo">
        <div class="sb-logo-icon">Λ</div>
        <div class="sb-logo-text">
          <div class="sb-logo-brand">ΛUTOVIU</div>
          <div class="sb-logo-model">Gestão Automotiva</div>
        </div>
      </div>
    </div>
    <nav class="sb-nav">
      <div class="nav-group-label">Principal</div>
      <a href="{{ url_for('main.index') }}" class="nav-item">
        <span class="ni"><i data-lucide="layout-dashboard"></i></span> Dashboard
      </a>
      <div class="nav-group-label">Veículo</div>
      <a href="{{ url_for('veiculo.index') }}" class="nav-item">
        <span class="ni"><i data-lucide="car"></i></span> Meus Veículos
      </a>
      <div class="nav-group-label" style="margin-top:auto">Conta</div>
      <a href="{{ url_for('auth.logout') }}" class="nav-item">
        <span class="ni"><i data-lucide="log-out"></i></span> Sair
      </a>
    </nav>
  </aside>

  <main id="main">
    <div class="page-topbar">
      <button class="btn btn-ghost btn-icon" id="sb-toggle">☰</button>
      <span class="page-topbar-title">Nova Despesa</span>
    </div>

    <div class="page-wrap">
      <div class="page-header">
        <div class="page-title">Nova Despesa</div>
      </div>

      <div class="flash-wrap">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for cat, msg in messages %}
          <div class="flash flash-{{ cat }}">{{ msg }}</div>
          {% endfor %}
        {% endwith %}
      </div>

      <div class="form-card">
        <form action="{{ url_for('despesa.add_despesa') }}" method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="form-group">
            <label class="form-label" for="descricao">Descrição *</label>
            <input class="form-control" type="text" id="descricao" name="descricao" required placeholder="Ex: Troca de óleo, IPVA...">
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="valor">Valor (R$) *</label>
              <input class="form-control" type="number" step="0.01" id="valor" name="valor" required placeholder="0,00">
            </div>
            <div class="form-group">
              <label class="form-label" for="data">Data *</label>
              <input class="form-control" type="date" id="data" name="data" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="categoria">Categoria *</label>
            <select class="form-control" id="categoria" name="categoria_id" required>
              <option value="">Selecione uma categoria</option>
              {% for categoria in categorias %}
              <option value="{{ categoria.id }}">{{ categoria.nome }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="form-actions">
            <a href="{{ url_for('main.index') }}" class="btn btn-ghost">Cancelar</a>
            <button type="submit" class="btn btn-primary">Salvar Despesa</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>

<script src="https://unpkg.com/lucide@0.298.0/dist/umd/lucide.min.js"></script>
<script src="{{ url_for('static', filename='js/automotive.js') }}"></script>
<script>document.getElementById('app').classList.add('ready'); if(window.lucide) lucide.createIcons();</script>
</body>
</html>

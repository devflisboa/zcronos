<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0C">
<title>Sem conexão | ΛUTOVIU</title>
<link rel="icon" href="/static/image/favicon.ico" type="image/x-icon">
<style>
:root { --gold:#D4AF37; --bg:#0A0A0C; --card:#111116; --text:#f0f0f0; --text2:#b0b8c2; --gold-border:rgba(212,175,55,0.28); }
* { box-sizing:border-box; }
html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text);
  font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
.wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.card { max-width:380px; width:100%; text-align:center; background:var(--card);
  border:1px solid var(--gold-border); border-radius:16px; padding:32px 24px; }
.card img { width:96px; height:96px; border-radius:20px; }
h1 { font-size:20px; color:var(--gold); margin:20px 0 8px; letter-spacing:.04em; }
p { color:var(--text2); font-size:15px; line-height:1.5; margin:0 0 24px; }
button { min-height:48px; width:100%; border:0; border-radius:10px; font-size:16px; font-weight:600;
  background:var(--gold); color:#000; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <img src="/static/image/icons/icon-192.png" alt="AUTOVIU">
    <h1>Sem conexão</h1>
    <p>Não foi possível falar com o servidor do ΛUTOVIU. Verifique sua internet e tente novamente.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </div>
</div>
<script>addEventListener('online', () => location.reload());</script>
</body>
</html>
